<article class="card article-card" data-category="{{CATEGORY_ID}}"><a class="article-card__clickable" href="{{URL}}" aria-label="Читать статью: {{TITLE}}"><div class="article-card__cover {{COVER_CLASS}}" role="img" aria-label="{{COVER_ALT}}">{{COVER_DECORATION}}</div><div class="article-card__body"><p class="article-card__category">{{CATEGORY}}</p><h2>{{TITLE}}</h2><p class="article-card__description">{{DESCRIPTION}}</p><div class="article-card__meta"><time datetime="{{DATE_ISO}}">{{DATE}}</time><span>{{READING_TIME}}</span></div><span class="article-card__link" aria-hidden="true">Читать →</span></div></a></article>
