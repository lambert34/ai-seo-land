      "heading": "First checks",
      "anchor": "first-checks"
    },
    {
      "type": "list",
      "ordered": true,
      "items": [
        "Check the website from another device and network.",
        "Record the exact error message and time.",
        "Check domain, DNS and SSL certificate status.",
        "Review hosting availability, disk space and recent changes.",
        "Inspect server and CMS logs before changing anything."
      ]
    },
    {
      "type": "h2",
      "heading": "Typical causes",
      "anchor": "typical-causes"
    },
    {
      "type": "text",
      "content": "<p>Common causes include a hosting incident, expired domain or certificate, incorrect DNS records, exhausted server resources, database failure, a broken deployment or update, incompatible plugins, malicious code and accidental configuration changes.</p>"
    },
    {
      "type": "h2",
      "heading": "What not to do",
      "anchor": "avoid"
    },
    {
      "type": "text",
      "content": "<p>Do not repeatedly reinstall components, delete files or restore an arbitrary old backup before preserving evidence and current data. Unstructured changes can make recovery harder.</p>"
    },
    {
      "type": "h2",
      "heading": "Recovery approach",
      "anchor": "recovery"
    },
    {
      "type": "text",
      "content": "<p>Make a backup, isolate the failing layer, restore service with the smallest safe change, then investigate the root cause. After recovery, verify forms, integrations, analytics, scheduled tasks and security.</p>"
    }
  ],
