  },
  "lead": "<p><strong>21 октября 2026 года разработчики PHP выпустили экстренные обновления безопасности, устраняющие две критические уязвимости с оценкой опасности 9,2 из 10.</strong> Под потенциальной угрозой находятся сайты на 1С-Битрикс, WordPress и других CMS, использующие уязвимые сборки PHP.</p><p>Компания «1С-Битрикс» уже опубликовала официальное предупреждение владельцам сайтов и коробочных порталов Битрикс24, рекомендовав срочно проверить серверное окружение и установить исправления.</p><p>Главная опасность заключается в том, что уязвимости потенциально позволяют злоумышленникам выполнять посторонний код на сервере без авторизации. При определённых условиях для атаки не требуется ни пароль администратора, ни доступ к панели управления сайтом.</p><p>Разбираемся, что произошло 21 октября, какие версии PHP необходимо обновить и что предпринять владельцам коммерческих сайтов, чтобы снизить риски взлома и сохранить работоспособность проекта.</p>",
  "blocks": [
    {
      "type": "h2",
      "heading": "Что произошло 21 октября 2026 года"
    },
    {
      "type": "text",
      "content": "<p>Команда разработчиков PHP выпустила исправления двух критических уязвимостей:</p>"
    },
    {
      "type": "text",
      "content": "<ul><li><strong>CVE-2026-109618</strong> — ошибка обработки памяти при нехватке ресурсов (Out-of-Memory), которая может привести к повреждению внутреннего состояния PHP и выполнению постороннего кода.</li><li><strong>CVE-2026-109619</strong> — ошибка управления внутренним состоянием PHP, при которой данные предыдущего запроса могут быть некорректно использованы при обработке последующих запросов.</li></ul>"
    },
    {
      "type": "text",
      "content": "<p>Обе уязвимости получили оценку <strong>CVSS 4.0 — 9,2 из 10</strong>, что соответствует критическому уровню опасности.</p>"
    },
    {
      "type": "text",
      "content": "<p>Наиболее серьёзный подтверждённый сценарий связан с выполнением PHP через Apache <code>mod_php</code>. Однако риск существует и для других распространённых серверных конфигураций, включая PHP-FPM.</p>"
    },
    {
      "type": "text",
      "content": "<p>Возможность конкретной атаки зависит от конфигурации сервера, установленной сборки PHP и других технических условий.</p>"
    },
    {
      "type": "text",
      "content": "<p>Важно понимать: наличие уязвимой версии PHP ещё не означает, что сайт уже взломан. Но эксплуатация подобных ошибок потенциально может привести к серьёзным последствиям, поэтому исправления необходимо устанавливать без неоправданной задержки.</p>"
    },
    {
      "type": "text",
      "content": "<p>Официальный источник: <a href=\"https://www.php.net/archive/2026.php#2026-10-21-5\" target=\"_blank\" rel=\"noopener noreferrer\">PHP Security Advisory от 21 октября 2026 года</a>.</p>"
    },
    {
      "type": "h2",
      "heading": "Почему под угрозой оказались сайты на 1С-Битрикс"
    },
    {
      "type": "text",
      "content": "<p>PHP — серверный язык программирования, который используется для работы многих систем управления сайтами.</p>"
    },
    {
      "type": "text",
      "content": "<p>На PHP работают сайты на «1С-Битрикс: Управление сайтом», WordPress и других популярных CMS.</p>"
    },
    {
      "type": "text",
      "content": "<p><strong>Уязвимости обнаружены не в коде самого Битрикс, а в PHP — внешнем серверном компоненте, который необходим для работы сайта.</strong></p>"
    },
    {
      "type": "text",
      "content": "<p>Поэтому даже полностью обновлённый Битрикс может использовать уязвимую версию PHP.</p>"
    },
    {
      "type": "text",
      "content": "<p>Обычное обновление CMS через SiteUpdate не обновляет интерпретатор PHP на сервере. Это две разные процедуры.</p>"
    },
    {
      "type": "text",
      "content": "<p>Компания «1С-Битрикс» отдельно предупредила владельцев сайтов и коробочных порталов Битрикс24 о необходимости установить исправления серверного PHP.</p>"
    },
    {
      "type": "text",
      "content": "<p>При этом нужно различать тип используемого продукта:</p>"
    },
    {
      "type": "text",
      "content": "<p><strong>Сайты на «1С-Битрикс: Управление сайтом».</strong> Необходимо проверить PHP на хостинге или сервере, где размещён сайт.</p>"
    },
    {
      "type": "text",
      "content": "<p><strong>Коробочный Битрикс24.</strong> Обновление PHP выполняет специалист, обслуживающий сервер портала.</p>"
    },
    {
      "type": "text",
      "content": "<p><strong>Облачный Битрикс24.</strong> Обновлением серверного окружения занимается сам поставщик облачного сервиса. Пользователям не нужно самостоятельно устанавливать PHP.</p>"
    },
    {
      "type": "text",
      "content": "<p>Источник: <a href=\"https://www.1c-bitrix.ru/about/news/29334792/\" target=\"_blank\" rel=\"noopener noreferrer\">официальное предупреждение 1С-Битрикс</a>.</p>"
    },
    {
      "type": "h2",
      "heading": "Какие версии PHP необходимо обновить"
    },
    {
      "type": "text",
      "content": "<p>21 октября 2026 года разработчики PHP выпустили исправленные версии для поддерживаемых веток.</p>"
    },
    {
      "type": "table",
      "headers": [
        "Установленная ветка",
        "Версия с исправлениями"
      ],
      "rows": [
        {
          "cells": [
            "PHP 8.5",
            "8.5.12 и новее"
          ]
        },
        {
          "cells": [
            "PHP 8.4",
            "8.4.27 и новее"
          ]
        },
        {
          "cells": [
            "PHP 8.3",
            "8.3.36 и новее"
          ]
        },
        {
          "cells": [
            "PHP 8.2",
            "8.2.35 и новее"
          ]
        },
        {
          "cells": [
            "PHP 8.1 и старше",
            "Подтверждённые исправления поставщика или переход на поддерживаемую версию"
          ]
        }
      ]
    },
    {
      "type": "text",
      "content": "<p>Например, если сайт работает на PHP 8.4.26, необходимо установить исправленный выпуск ветки 8.4.</p>"
    },
    {
      "type": "text",
      "content": "<p>Если проект использует PHP 7.4, 8.0 или 8.1, ситуация сложнее: эти версии больше не получают стандартные обновления безопасности от команды PHP.</p>"
    },
    {
      "type": "text",
      "content": "<p>Для некоторых устаревших веток разработчики подготовили исправления исходного кода. Готовые обновления также могут предоставляться поставщиками Linux-дистрибутивов или расширенной технической поддержки.</p>"
    },
    {
      "type": "text",
      "content": "<p>Отдельно стоит учитывать <strong>backport-патчи</strong> — исправления, которые поставщик переносит в более старую сборку без изменения основного номера версии.</p>"
    },
    {
      "type": "text",
      "content": "<p>Поэтому одного номера PHP не всегда достаточно для окончательного вывода о безопасности. Нужно проверить информацию о конкретном установленном пакете.</p>"
    },
    {
      "type": "text",
      "content": "<p>Не следует сразу переводить старый коммерческий сайт с PHP 7.4 на PHP 8.5 без проверки совместимости. Резкое обновление способно нарушить работу шаблона, модулей, форм и интеграций.</p>"
    },
    {
      "type": "h2",
      "heading": "Чем опасны уязвимости PHP для бизнеса"
    },
    {
      "type": "text",
      "content": "<p>Возможное удалённое выполнение кода — одна из наиболее серьёзных категорий уязвимостей серверного программного обеспечения.</p>"
    },
    {
      "type": "text",
      "content": "<p>При успешной эксплуатации злоумышленник потенциально может выполнять действия в пределах доступных PHP-процессу полномочий.</p>"
    },
    {
      "type": "text",
      "content": "<p>В зависимости от конфигурации сервера возможны следующие последствия:</p>"
    },
    {
      "type": "text",
      "content": "<ul><li><strong>Взлом сайта.</strong> Вредоносный код может быть внедрён в доступные для изменения файлы.</li><li><strong>Утечка информации.</strong> Под угрозой могут оказаться данные, доступные серверному приложению.</li><li><strong>Нарушение работы сайта.</strong> Могут перестать открываться страницы, отправляться формы или оформляться заказы.</li><li><strong>Перенаправление пользователей.</strong> Посетителей могут переводить на мошеннические ресурсы.</li><li><strong>Потеря заявок и рекламного бюджета.</strong> Бизнес может продолжать оплачивать привлечение пользователей на повреждённый сайт.</li><li><strong>Репутационные последствия.</strong> Восстановление доверия клиентов после серьёзного инцидента иногда оказывается сложнее самого технического ремонта.</li></ul>"
    },
    {
      "type": "text",
      "content": "<p>При этом успешная атака не обязательно приводит к немедленному отключению сайта.</p>"
    },
    {
      "type": "text",
      "content": "<p>Некоторые изменения могут оставаться незаметными для владельца продолжительное время.</p>"
    },
    {
      "type": "text",
      "content": "<p>Поэтому проверять стоит не только факт доступности страниц, но и общее техническое состояние сайта, наличие исправлений и признаки подозрительной активности.</p>"
    },
    {
      "type": "h2",
      "heading": "Как проверить версию PHP на сайте на 1С-Битрикс"
    },
    {
      "type": "text",
      "content": "<p>Первое, что необходимо сделать, — определить, какая версия PHP фактически обслуживает сайт.</p>"
    },
    {
      "type": "h3",
      "heading": "Способ 1. Проверка через хостинг"
    },
    {
      "type": "text",
      "content": "<p>Откройте панель управления хостингом и найдите раздел управления PHP.</p>"
    },
    {
      "type": "text",
      "content": "<p>Название зависит от провайдера: «Версия PHP», «Настройки PHP», «Управление PHP» или аналогичный.</p>"
    },
    {
      "type": "text",
      "content": "<p>Здесь обычно можно посмотреть установленную версию и доступные обновления.</p>"
    },
    {
      "type": "text",
      "content": "<p>Однако для окончательного подтверждения безопасности важно выяснить не только номер версии, но и наличие исправлений конкретных уязвимостей.</p>"
    },
    {
      "type": "h3",
      "heading": "Способ 2. Проверка через административную панель Битрикс"
    },
    {
      "type": "text",
      "content": "<p>На некоторых установках «1С-Битрикс: Управление сайтом» доступен инструмент:</p>"
    },
    {
      "type": "text",
      "content": "<p><strong>Настройки → Инструменты → Командная PHP-строка</strong></p>"
    },
    {
      "type": "text",
      "content": "<p>Если инструмент доступен и у вас есть необходимые права администратора, можно выполнить следующий диагностический код:</p>"
    },
    {
      "type": "code",
      "language": "php",
      "code": "echo '<pre>';\necho 'PHP VERSION: ' . PHP_VERSION . \"\\n\";\necho 'PHP SAPI: ' . PHP_SAPI . \"\\n\";\necho 'UPLOAD PROGRESS: ' .\n    ini_get('session.upload_progress.enabled') . \"\\n\";\necho '</pre>';"
    },
    {
      "type": "text",
      "content": "<p>Этот код ничего не изменяет на сайте. Он выводит используемую версию PHP, способ её выполнения и значение настройки отслеживания загрузки файлов.</p>"
    },
    {
      "type": "text",
      "content": "<p>Результаты не стоит публиковать в открытом доступе без необходимости.</p>"
    },
    {
      "type": "text",
      "content": "<p><strong>Важное замечание:</strong> версия PHP, которую показывает команда <code>php -v</code> в SSH, может отличаться от версии, обрабатывающей запросы посетителей сайта.</p>"
    },
    {
      "type": "text",
      "content": "<p>Если используются несколько серверов, контейнеров или PHP-FPM-пулов, необходимо проверить каждый из них.</p>"
    },
    {
      "type": "text",
      "content": "<p>Итоговую проверку установленного исправления лучше поручить специалисту, который имеет доступ к серверному окружению.</p>"
    },
    {
      "type": "h2",
      "heading": "Как правильно обновить PHP и не сломать сайт"
    },
    {
      "type": "text",
      "content": "<p>Экстренное обновление требует оперативности, но не должно превращаться в хаотичное изменение настроек рабочего сервера.</p>"
    },
    {
      "type": "text",
      "content": "<p>Рекомендуемый порядок действий следующий.</p>"
    },
    {
      "type": "h3",
      "heading": "Шаг 1. Определить установленную версию PHP"
    },
    {
      "type": "text",
      "content": "<p>Проверяем используемую версию, тип сервера и наличие исправленных пакетов у хостинг-провайдера.</p>"
    },
    {
      "type": "text",
      "content": "<p>Одновременно уточняем, кто отвечает за обновление серверного окружения.</p>"
    },
    {
      "type": "h3",
      "heading": "Шаг 2. Сделать резервную копию"
    },
    {
      "type": "text",
      "content": "<p>Перед изменениями необходимо сохранить:</p>"
    },
    {
      "type": "text",
      "content": "<ul><li>файлы сайта;</li><li>базу данных;</li><li>важные настройки серверного окружения;</li><li>конфигурации критичных интеграций.</li></ul>"
    },
    {
      "type": "text",
      "content": "<p>Резервная копия должна быть пригодна для восстановления.</p>"
    },
    {
      "type": "text",
      "content": "<p>По возможности обновление сначала проверяется на тестовом окружении.</p>"
    },
    {
      "type": "h3",
      "heading": "Шаг 3. Проверить совместимость"
    },
    {
      "type": "text",
      "content": "<p>Необходимо учитывать версию Битрикс, шаблоны, сторонние модули и индивидуальные доработки.</p>"
    },
    {
      "type": "text",
      "content": "<p>Это особенно важно для проектов, которые годами работали на устаревших версиях PHP.</p>"
    },
    {
      "type": "text",
      "content": "<p>Задача состоит не просто в установке обновления, а в сохранении работоспособности проекта после него.</p>"
    },
    {
      "type": "h3",
      "heading": "Шаг 4. Установить исправления безопасности"
    },
    {
      "type": "text",
      "content": "<p>Обновление выполняется через средства хостинга, администратора сервера или штатный механизм установки серверных пакетов.</p>"
    },
    {
      "type": "text",
      "content": "<p>Для поддерживаемых веток PHP рекомендуется использовать соответствующие исправленные версии.</p>"
    },
    {
      "type": "text",
      "content": "<p>Если установлены специальные пакеты Linux или коммерческие LTS-сборки, нужно подтвердить, что исправления присутствуют именно в них.</p>"
    },
    {
      "type": "h3",
      "heading": "Шаг 5. Перезапустить PHP-процессы"
    },
    {
      "type": "text",
      "content": "<p>После установки обновления необходимо перезапустить соответствующие службы, чтобы работающие процессы начали использовать исправленную сборку.</p>"
    },
    {
      "type": "text",
      "content": "<p>В зависимости от серверной конфигурации это могут быть PHP-FPM, Apache с модулем PHP или процессы контейнеризированного приложения.</p>"
    },
    {
      "type": "text",
      "content": "<p>При использовании PHP-FPM перезапуска только nginx недостаточно.</p>"
    },
    {
      "type": "h3",
      "heading": "Шаг 6. Проверить сайт после обновления"
    },
    {
      "type": "text",
      "content": "<p>На коммерческом сайте важно протестировать не только открытие главной страницы.</p>"
    },
    {
      "type": "text",
      "content": "<p>В первую очередь проверяем:</p>"
    },
    {
      "type": "text",
      "content": "<ul><li>формы заявок и отправку уведомлений;</li><li>авторизацию и личный кабинет;</li><li>каталог и карточки товаров;</li><li>корзину и оформление заказов;</li><li>AJAX и интерактивные элементы;</li><li>интеграции с CRM и 1С;</li><li>административную панель;</li><li>основные разделы сайта.</li></ul>"
    },
    {
      "type": "text",
      "content": "<p>После проверки стоит изучить журналы ошибок сервера и PHP.</p>"
    },
    {
      "type": "text",
      "content": "<p>Если есть основания подозревать попытки эксплуатации уязвимостей, потребуется отдельный анализ безопасности.</p>"
    },
    {
      "type": "cta",
      "heading": "Нужна помощь с обновлением PHP?",
      "description": "Проверим серверное окружение, совместимость и работу сайта после установки исправлений.",
      "label": "Проверить сайт на 1С-Битрикс",
      "url": "/bitrix-support/",
      "linkType": "internal"
    },
