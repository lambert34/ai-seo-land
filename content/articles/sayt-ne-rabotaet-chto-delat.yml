    content: >-
      Когда сайт внезапно перестаёт открываться, первая реакция обычно одна:
      «Что сломалось?». Причин может быть десятки — от кратковременного сбоя
      хостинга до проблем с DNS, SSL-сертификатом, базой данных, CMS или
      заражения сайта.


      При этом внешне совершенно разные проблемы нередко выглядят одинаково:
      пользователь открывает адрес и видит белый экран, ошибку сервера,
      бесконечную загрузку или сообщение о невозможности установить соединение.


      Поэтому главная задача — не начинать хаотично менять настройки, а
      последовательно определить, **на каком уровне возник сбой**.


      В этой статье разберём, почему сайт может перестать работать, что можно
      проверить самостоятельно и в каких ситуациях безопаснее сразу переходить к
      технической диагностике.


      ## Что значит «сайт не работает»


      Фразой «сайт не работает» пользователи называют несколько совершенно
      разных ситуаций.


      Сайт может вообще не открываться. Может открываться главная страница, но
      не работать отдельные разделы. Иногда перестают отправляться формы заявок,
      возникают ошибки 500 или 403, пропадает HTTPS, страница загружается
      бесконечно или сайт доступен владельцу, но не открывается у клиентов.


      От конкретного симптома зависит направление диагностики.


      Например, если браузер сообщает, что сервер не найден, сначала стоит
      проверить домен и DNS. Если сервер отвечает ошибкой 500 — проблема уже,
      скорее всего, находится на стороне приложения, PHP, CMS или хостинга. А
      если страница открывается, но вместо нормального содержимого появляется
      сообщение об ошибке базы данных, искать неисправность нужно ещё глубже.


      Поэтому формулировка «сайт сломался» — только исходная точка.


      ## Почему сайт может перестать работать


      Одна из самых распространённых причин — проблема на стороне хостинга или
      сервера.


      Сервер может временно быть недоступен, закончиться место на диске, сайт
      может превысить доступные ресурсы тарифа или перестать отвечать один из
      необходимых сервисов. В некоторых случаях проблему вызывает обновление
      конфигурации PHP, базы данных или веб-сервера.


      Другая большая группа причин связана с доменом и DNS.


      Например, закончилась регистрация домена, были изменены DNS-записи, сайт
      перенесли на другой сервер, но записи ещё не обновились, либо произошла
      ошибка при настройке поддомена. Тогда сам сайт и файлы могут быть
      полностью исправны, но пользователь просто не попадает на нужный сервер.


      Отдельно стоит проверить SSL-сертификат. Если сертификат закончился,
      установлен неправильно или перестал соответствовать домену, браузер может
      показывать предупреждение безопасности или вообще блокировать нормальный
      доступ к сайту.


      Наконец, проблема может находиться непосредственно внутри CMS и кода
      сайта: неудачное обновление, несовместимость плагинов или модулей,
      изменение PHP-версии, повреждение файлов, ошибка базы данных, неправильные
      права доступа, сторонняя интеграция или вредоносный код.


      Именно поэтому две внешне похожие ошибки иногда требуют совершенно разного
      ремонта.


      ## Что проверить в первую очередь


      Когда клиент сообщает мне, что сайт перестал работать, я обычно не начинаю
      сразу менять файлы или настройки CMS. Сначала нужно максимально сузить
      область поиска.


      Базовая последовательность диагностики выглядит так:


      1. Проверить, открывается ли домен вообще и отвечает ли сервер.

      2. Убедиться, что регистрация домена не закончилась и DNS-записи указывают
      на правильный сервер.

      3. Проверить HTTP-код ответа: `200`, `301`, `403`, `404`, `500`, `502`,
      `503` или другой.

      4. Проверить SSL-сертификат и HTTPS.

      5. Посмотреть состояние хостинга: ресурсы, свободное место, доступность
      PHP и базы данных.

      6. Проверить журнал ошибок сервера и PHP.

      7. Выяснить, какие изменения происходили непосредственно перед поломкой:
      обновление CMS, установка модуля, изменение шаблона, перенос сайта,
      настройка DNS или SSL.

      8. Проверить базу данных, подключение к ней и наличие ошибок CMS.

      9. Проверить файлы сайта на изменения и подозрительный код.

      10. Только после определения вероятной причины вносить изменения.


      Такая последовательность позволяет не превращать диагностику в перебор
      случайных действий.


      ## Если сайт не открывается вообще


      Если браузер пишет, что не удалось установить соединение с сайтом или
      сервер не найден, начать стоит с инфраструктурного уровня.


      Нужно проверить сам домен, DNS и сервер.


      Особенно часто такие ситуации возникают после переноса сайта между
      хостингами, смены DNS-серверов или редактирования записей типа `A`,
      `AAAA`, `CNAME`.


      При этом важно учитывать, что обновление DNS происходит не мгновенно.
      После изменения записей часть пользователей может уже попадать на новый
      сервер, а часть — ещё видеть старый адрес.


      Похожая ситуация возможна и при проблемах непосредственно у
      хостинг-провайдера. Если сервер недоступен, никакие изменения внутри CMS
      не помогут до восстановления его работы.


      ## Если сайт показывает ошибку 500


      Ошибка `500 Internal Server Error` означает, что запрос до сервера дошёл,
      но сервер не смог нормально его обработать.


      Причина может находиться в PHP-коде, конфигурации сервера, CMS, плагине,
      модуле, `.htaccess`, базе данных или правах доступа.


      Здесь уже особенно важны серверные логи.


      Без них попытка исправить ошибку превращается в угадывание: отключать
      плагины, менять PHP, восстанавливать файлы или переписывать конфигурацию
      можно долго, а реальная причина иногда указывается буквально в одной
      строке журнала ошибок.


      ## Если сайт сломался после обновления


      Отдельный сценарий — сайт работал нормально, а после обновления CMS,
      шаблона, модуля или PHP перестал открываться.


      В этом случае нужно в первую очередь установить, что именно было изменено.


      Проблема может быть связана с несовместимостью новой версии PHP,
      устаревшим модулем, конфликтом расширений, изменением структуры базы
      данных или ошибкой непосредственно в обновлении.


      По возможности перед серьёзными изменениями сайта должна существовать
      резервная копия файлов и базы данных. Тогда рабочее состояние можно
      восстановить значительно быстрее.


      Но восстанавливать backup вслепую тоже не всегда правильно: если проблема
      возникла из-за вируса или ошибки, которая уже была в резервной копии,
      простое восстановление вернёт её обратно.


      ## Если сайт работает у вас, но не работает у других


      Такой симптом часто сбивает с толку.


      Владелец открывает сайт со своего компьютера и видит нормальную страницу,
      а клиенты жалуются, что сайт недоступен.


      Причина может быть в DNS-кеше, провайдере, CDN, региональной
      маршрутизации, блокировке IP-адресов, настройках firewall или даже в том,
      что разные пользователи попадают на разные серверы.


      Проверять сайт в такой ситуации нужно не только со своего компьютера.


      Полезно сравнить доступность с мобильной сети, другого интернет-провайдера
      и внешних сервисов проверки HTTP-ответа. Если проблема воспроизводится
      только из определённой сети или региона, область поиска становится гораздо
      уже.


      ## Почему сайт может долго загружаться, хотя технически он работает


      Сайт может формально отдавать `200 OK`, но для пользователя фактически
      быть почти неработоспособным из-за очень долгой загрузки.


      Тогда нужно смотреть производительность сервера, запросы к базе данных,
      кеширование, изображения, JavaScript, внешние сервисы и работу CMS.


      Для сайтов на 1С-Битрикс этому посвящён отдельный материал: почему сайт на
      1С-Битрикс работает медленно.


      Если проблема связана именно с Битрикс и требуется не разовая диагностика,
      а дальнейшая поддержка и доработка проекта, можно посмотреть формат
      [технической поддержки сайтов на 1С-Битрикс](/bitrix-support/).


      ## Не работают формы, заявки или отдельные функции сайта


      Иногда сайт визуально полностью исправен, но перестаёт выполнять
      бизнес-задачу.


      Например, клиент заполняет форму, нажимает кнопку «Отправить», видит
      сообщение об успешной отправке — но заявка не приходит владельцу сайта.


      Причина может находиться в самой форме, PHP-обработчике, почтовой системе,
      SMTP, CRM, webhook или стороннем сервисе.


      Поэтому работоспособность сайта нельзя оценивать только по внешнему виду.


      После серьёзных изменений стоит отдельно проверять:


      отправку форм, уведомления на email, интеграции с CRM, оплату,
      авторизацию, поиск, корзину и другие критически важные сценарии.


      В будущем эту тему я отдельно разберу на примере ситуации, когда **Метрика
      фиксирует действие пользователя, но сама заявка не доходит до почты или
      CRM**.


      ## Может ли причиной быть вирус


      Да.


      Вредоносный код может приводить не только к появлению подозрительных
      страниц или рекламы.


      После заражения сайт может перенаправлять пользователей на другие домены,
      работать только для части посетителей, сильно нагружать сервер, создавать
      новые файлы, менять существующий код или переставать нормально
      открываться.


      Если есть подозрение на заражение, недостаточно удалить первый найденный
      подозрительный файл.


      Нужно определить способ проникновения, проверить остальные файлы,
      пользователей CMS, модули, пароли и обновления. Иначе после очистки
      вредоносный код может появиться снова.


      ## Что можно сделать самостоятельно


      Если речь идёт о собственном сайте и есть доступ к хостингу, базовую
      диагностику вполне можно провести самостоятельно.


      Безопасно проверить состояние домена, срок действия SSL, DNS-записи,
      доступность сервера, свободное место на хостинге и наличие резервных
      копий.


      Если проблема появилась после конкретного действия, важно прежде всего
      зафиксировать это: что обновлялось, какой файл менялся, какой модуль
      устанавливался, какой PHP использовался до изменения.


      А вот бессистемно удалять файлы, менять конфигурацию сервера,
      импортировать старую базу данных или восстанавливать произвольные
      резервные копии без понимания причины я бы не советовал.


      В результате к исходной проблеме иногда добавляются новые.


      ## Когда уже нужен специалист


      Если сайт является рабочим инструментом бизнеса, долго экспериментировать
      обычно экономически невыгодно.


      Особенно если перестали поступать заявки, не работает интернет-магазин,
      сайт полностью недоступен или проблема появилась после вмешательства в
      сервер, CMS или базу данных.


      В таком случае логичнее сначала провести диагностику и определить реальную
      причину.


      Я обычно разделяю такую работу на два этапа: сначала определить
      неисправность и масштаб проблемы, затем уже согласовать способ
      восстановления.


      Это позволяет заранее понимать, идёт ли речь о локальной ошибке или о
      полноценном восстановлении проекта.  
        
      Сколько стоит восстановление сайта


      Универсальной стоимости здесь нет, потому что под словами «сайт не
      работает» могут скрываться совершенно разные задачи.


      Исправить ошибку в одном обработчике и восстановить повреждённую базу
      данных после серьёзного сбоя — это разные объёмы работы.


      То же касается заражения сайта: иногда достаточно локальной очистки и
      устранения уязвимости, а иногда приходится анализировать десятки
      изменённых файлов, пользователей CMS, конфигурацию и сервер.


      Поэтому сначала проводится диагностика.


      Для разовых задач у Lambert/Digital стоимость срочной технической помощи
      начинается **от 5 000 ₽**. Итоговый объём работ зависит от причины
      неисправности и состояния проекта.


      Подробнее о формате работы: [срочная техническая помощь
      сайту](/site-help/).


      ## Как снизить вероятность повторного сбоя


      Полностью исключить технические проблемы невозможно, но большую часть
      рисков можно сократить.


      Самое важное — иметь актуальные резервные копии файлов и базы данных,
      обновлять CMS и модули осознанно, контролировать срок действия домена и
      SSL, следить за свободным местом на сервере и не вносить серьёзные
      изменения непосредственно на рабочем сайте без возможности отката.


      Для коммерческого проекта также полезен регулярный технический контроль:
      формы могут перестать отправляться незаметно, SSL — закончиться,
      интеграция — сломаться после обновления API, а сайт — постепенно
      замедлиться из-за накопившихся проблем.


      То есть хорошее техническое обслуживание — это не только ремонт уже
      сломанного сайта.


      ## Краткий вывод


      Если сайт не работает или внезапно перестал открываться, не стоит начинать
      с хаотичного изменения настроек.


      Сначала необходимо понять уровень проблемы: домен, DNS, SSL, сервер, база
      данных, CMS, код или сторонняя интеграция.


      В некоторых случаях причина находится за несколько минут. В других
      требуется полноценная диагностика серверных логов, файлов и базы данных.


      Главное — отделить симптом от причины.


      Если сайт критичен для бизнеса и из-за сбоя перестали поступать заявки или
      заказы, время часто важнее самостоятельных экспериментов. В таком случае
      можно сразу перейти к [диагностике и срочному восстановлению
      сайта](/site-help/).
